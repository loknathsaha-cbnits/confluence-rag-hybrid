[project]
name = "ops-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "chainlit>=2.11.1",
    "fastapi>=0.136.1",
    "flashrank>=0.2.10",
    "huggingface-hub>=1.15.0",
    "langchain>=1.3.1",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openai>=1.2.1",
    "langgraph>=1.2.0",
    "pinecone>=9.0.0",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=5.5.0",
    # CPU-only torch — no CUDA/NVIDIA runtime pulled in
    "torch>=2.6.0",
    "uvicorn>=0.47.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true                   # only used when explicitly referenced below

[tool.uv.sources]
torch = { index = "pytorch-cpu" } # forces the +cpu wheel, skips GPU variants

[tool.uv]
# Keeps the lock file reproducible across machines (Linux/Mac/Windows)
# without accidentally pulling a CUDA wheel on a GPU-enabled CI runner
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
    "sys_platform == 'win32'",
]
